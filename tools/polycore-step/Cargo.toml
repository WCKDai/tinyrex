[package]
name = "polycore-step"
version = "0.1.0"
edition = "2024"
description = "Turn a JSON recipe of CAD parts into an assembly STEP file with the PolyCore kernel"
license = "Apache-2.0"
publish = false

# Standalone: never pulled into another workspace.
[workspace]

[lib]
name = "polycore_step"
path = "src/lib.rs"

[[bin]]
name = "polycore-step"
path = "src/main.rs"

[dependencies]
solidcraft-kernel = { path = "../../../polycore/crates/polycore" }
solidcraft-geom = { path = "../../../polycore/crates/solidcraft-geom" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Truck's debug-only assertions reject valid seam and closed-edge geometry (see PolyCore's
# CONTRIBUTING.md), so even dev/test builds run without them.
[profile.dev]
opt-level = 1
debug-assertions = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"

[lints.clippy]
# `!(x > tol)` is the NaN-safe "not a usable number" idiom, as in PolyCore.
neg_cmp_op_on_partial_ord = "allow"
